[project]
name = "ck3-llm-chronicler"
version = "1.0.0"
description = "Turns Crusader Kings III campaigns into a written chronicle: reads your saves, hands each tracked life to an LLM, writes biographies into a git repo you own"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "prekabreki", email = "prekabreki@users.noreply.github.com" }]
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "markdown-it-py>=4.0.0",
    "msgspec>=0.18",
    "pillow>=12.2.0",
    "pydantic>=2.13.3",
    "sqlalchemy>=2.0.49",
    "typer>=0.25.0",
    "uvicorn[standard]>=0.46.0",
    "watchfiles>=1.1.1",
]

[project.optional-dependencies]
# PDF chronicle export. Kept out of the core install
# because the xhtml2pdf -> svglib -> rlpycairo -> pycairo chain needs system
# cairo + cmake to build (no pycairo wheel on every Python/OS), which breaks a
# stock `uv sync` on Linux. Install with `uv sync --extra pdf` when you need the
# PDF export endpoint; the rest of the app runs without it.
pdf = [
    "xhtml2pdf>=0.2.17",
]

[project.scripts]
chronicler = "chronicler.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronicler"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# typer's idiom is to call typer.Option/Argument at default; FastAPI's
# is to call Depends/Query/Body, so B008 is disabled for these.
extend-immutable-calls = [
    "typer.Option",
    "typer.Argument",
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
# Pin imports to THIS rootdir's src/. The editable install writes an
# interpreter-global _editable_impl_chronicler.pth, so parallel git worktrees
# would otherwise all import the main checkout's source instead of their own.
pythonpath = ["src"]
